[build]
  publish = "public"
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# PANEL DE ADMINISTRACIÓN (Decap CMS) — solo roles editor y admin
# ---------------------------------------------------------------------------
# El CMS pide /admin/config.yml como archivo real: se sirve tal cual
# (debe ir ANTES del redirect por rol, que se evalua de arriba a abajo).
[[redirects]]
  from = "/admin/config.yml"
  to = "/admin/config.yml"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = { Role = ["editor", "admin"] }

# Si no tiene rol editor/admin, "/admin" devuelve la home (no se deja entrar)
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# PANEL DE ESTADÍSTICAS (dashboard) — solo rol admin (el dueño)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard-negado.html"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# Login / registro público
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/acceso/*"
  to = "/acceso/index.html"
  status = 200

# Resto del sitio: sirve index.html (SPA-friendly)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200