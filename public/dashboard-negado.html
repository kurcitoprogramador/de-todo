<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Acceso restringido · De Todo</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #4a4453;
    background: linear-gradient(160deg, #fdeef4 0%, #eef7f1 45%, #fdf3ea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    max-width: 420px;
    text-align: center;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(74, 68, 83, 0.12);
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #8a8296; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  a {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 999px;
    background: linear-gradient(90deg, #b7e4c7, #ffd8be);
    color: #4a4453;
    font-weight: 700;
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Acceso restringido</h1>
    <p>El panel de estadísticas es solo para el administrador de la tienda.</p>
    <a href="/">Volver a la tienda</a>
  </div>
</body>
</html>
