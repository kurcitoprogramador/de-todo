backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Agregar producto: {{collection}}/{{slug}}"
    update: "Actualizar producto: {{collection}}/{{slug}}"
    delete: "Eliminar producto: {{collection}}/{{slug}}"
    uploadMedia: "Subir imagen: {{path}}"
    deleteMedia: "Eliminar imagen: {{path}}"

# Las fotos subidas desde el panel van a la carpeta products/ (dentro de public/)
media_folder: "public/products"
public_folder: "/products"

collections:
  - name: "catalogo"
    label: "Catálogo"
    label_singular: "Producto"
    description: "Administra los productos del catálogo de De Todo."
    files:
      - name: "productos"
        label: "Productos"
        file: "public/products.json"
        summary: "{{name}} — S/ {{price}} ({{availability}})"
        fields:
          - label: "Número de WhatsApp"
            name: "whatsapp"
            widget: "string"
            hint: "Número al que llegan las compras (solo dígitos, con código de país)."
            default: "51961841885"
          - label: "Lista de productos"
            name: "products"
            widget: "list"
            label_singular: "producto"
            summary: "{{name}} — S/ {{price}}"
            fields:
              - { label: "Nombre del producto", name: "name", widget: "string" }
              - { label: "Precio (S/)", name: "price", widget: "number", hint: "Precio en soles." }
              - { label: "Descripción corta", name: "description", widget: "text" }
              - { label: "Etiqueta", name: "tag", widget: "string", hint: "Ej.: Nuevo, Perfumes, Bolso, Calzado...", required: false }
              - label: "Disponibilidad"
                name: "availability"
                widget: "select"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Pocas unidades", value: "pocas" }
                  - { label: "Agotado", value: "agotado" }
              - label: "Fotos del producto"
                name: "images"
                widget: "list"
                hint: "Sube una o más fotos. La primera será la principal."
                allow_add: true
                field:
                  label: "Foto"
                  widget: "image"

publish_mode: editorial_workflow