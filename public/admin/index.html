<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel - De Todo</title>
<style>
  /* Editor cómodo en pantallas táctiles (iPhone/Android) */
  @media (max-width: 820px) {
    #nc-root input, #nc-root select, #nc-root textarea, #nc-root button,
    .netlify-identity-widget input, .netlify-identity-widget button {
      font-size: 16px !important; /* evita el zoom automático de iOS */
    }
    #nc-root button, #nc-root [class*="Button"], #nc-root a[class*="Link"] {
      min-height: 44px !important;
    }
    #nc-root input, #nc-root select, #nc-root textarea {
      min-height: 44px !important;
      padding: 10px 12px !important;
    }
    #nc-root [class*="ControlPane"] { padding: 12px !important; }
    .netlify-identity-widget { font-size: 16px; }
  }
</style>
</head>
<body>
<!--
  Decap CMS (ex Netlify CMS). Backend: Git Gateway.
  El operador entra con email + contraseña (Netlify Identity), sin cuenta de GitHub.
-->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.5.0/dist/decap-cms.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
