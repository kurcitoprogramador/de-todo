<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Acceso · De Todo</title>
<style>
  :root {
    --mint: #b7e4c7;
    --pink: #f9d5e5;
    --peach: #ffd8be;
    --cream: #fdf6ee;
    --ink: #4a4453;
    --ink-soft: #8a8296;
    --surface: #ffffff;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fdeef4 0%, #eef7f1 45%, #fdf3ea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 14px 40px rgba(74, 68, 83, 0.12);
    padding: 28px;
  }
  .logo {
    display: block;
    max-width: 160px;
    margin: 0 auto 6px;
  }
  h1 { font-size: 20px; text-align: center; margin: 8px 0 2px; }
  .sub { color: var(--ink-soft); font-size: 13px; text-align: center; margin: 0 0 22px; }
  .hint { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 18px 0 0; }
  .hint a { color: var(--ink); font-weight: 600; }
  .err {
    background: #ffe5e5;
    color: #b3403a;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin: 0 0 14px;
    display: none;
  }
  .info {
    background: #eef7f1;
    color: #2a6f4a;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin: 0 0 14px;
    display: none;
  }
.session { text-align: center; padding: 4px 0; }
  .session .email { font-weight: 700; color: var(--ink); margin: 0 0 4px; word-break: break-word; }
  .session .role { font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; }
  .session button {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #session-go { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
  #logout-btn { background: #f5f0f8; color: #5a5563; border: 1px solid #e3d9ef; }
  #session-stats {
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  #identity-gate { display: none; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/isologo/isologo-pastel-soft-144.png" alt="De Todo" />
    <h1>Bienvenido a De Todo</h1>
    <p class="sub">Inicia sesión o regístrate con tu correo.</p>

    <div class="err" id="err"></div>
    <div class="info" id="info"></div>

    <div id="identity-gate">
      <div data-netlify-identity-button>Entrar / Registrarse</div>
    </div>

    <div class="session" id="session-panel" style="display:none">
      <p class="email" id="session-email"></p>
      <p class="role" id="session-role"></p>
      <button id="session-go" style="display:none">Ir al panel</button>
      <a id="session-stats" href="/dashboard/" style="display:none">Ver estadísticas</a>
      <button id="logout-btn">Cerrar sesión</button>
    </div>

    <noscript>
      <p class="hint">Necesitas activar JavaScript para iniciar sesión.</p>
    </noscript>

    <p class="hint">
      ¿Solo quieres ver el catálogo? <a href="/">Ir a la tienda</a>
    </p>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      var errEl  = document.getElementById("err");
      var infoEl = document.getElementById("info");
      var gate   = document.getElementById("identity-gate");
      var sessionPanel  = document.getElementById("session-panel");
      var sessionEmail  = document.getElementById("session-email");
      var sessionRole   = document.getElementById("session-role");
      var sessionGo     = document.getElementById("session-go");
      var sessionStats = document.getElementById("session-stats");
      var logoutBtn     = document.getElementById("logout-btn");
      var sessionRoles  = [];

      function roleLabel(roles) {
        if (roles.indexOf("admin") !== -1) return "admin";
        if (roles.indexOf("editor") !== -1) return "editor";
        return "sin rol (solo lectura)";
      }

      function showSessionPanel(email) {
        gate.style.display = "none";
        infoEl.style.display = "none";
        errEl.style.display = "none";
        sessionEmail.textContent = "Sesión iniciada · " + email;
        sessionRole.textContent = "Rol: " + roleLabel(sessionRoles);
        var hasAccess = sessionRoles.indexOf("admin") !== -1 || sessionRoles.indexOf("editor") !== -1;
        sessionGo.style.display = hasAccess ? "block" : "none";
        sessionStats.style.display = sessionRoles.indexOf("admin") !== -1 ? "block" : "none";
        sessionPanel.style.display = "block";
      }

      sessionGo.addEventListener("click", function () { redirectByRoles(sessionRoles); });
      logoutBtn.addEventListener("click", function () {
        window.netlifyIdentity.logout();
      });

      // ----------------------------------------------------------------------
      // Netlify Identity: ruta canónica de roles.
      //   app_metadata.roles                 <- fuente canónica (Netlify Identity)
      //   app_metadata.authorization.roles   <- solo lectura legacy/externo
      // ----------------------------------------------------------------------
      function rolesOf(user) {
        if (!user) return [];
        var am = user.app_metadata || {};
        if (Array.isArray(am.roles)) return am.roles;
        if (am.authorization && Array.isArray(am.authorization.roles)) return am.authorization.roles;
        return [];
      }

      // Decodifica SOLO el payload del JWT (sin verificar firma).
      // Temporal: sirve para el diagnóstico de roles. No muestra tokens.
      function decodeJwtPayload(token) {
        try {
          var b64 = token.split(".")[1];
          if (!b64) return null;
          var normalized = b64.replace(/-/g, "+").replace(/_/g, "/");
          var padded = normalized + "=".repeat((4 - (normalized.length % 4)) % 4);
          var json = decodeURIComponent(
            atob(padded)
              .split("")
              .map(function (c) {
                return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
              })
              .join("")
          );
          return JSON.parse(json);
        } catch (err) {
          console.error("JWT decode error:", err);
          return null;
        }
      }

      // Obtiene un JWT renovado y el perfil fresco del servidor.
      // jwt(true) fuerza una renovación REAL: Netlify acuña un token nuevo
      // (con los roles actuales del registro) y renueva la cookie nf_jwt
      // por servidor (cabecera X-Use-Cookie). Si no está disponible, cae a
      // refresh() del widget; getUserData() actualiza app_metadata.
      async function getFreshSession(user) {
        if (!user) return null;
        try {
          var cur = window.netlifyIdentity.currentUser() || user;
          var jwt = null;
          if (cur && typeof cur.jwt === "function") {
            jwt = await cur.jwt(true);
          } else {
            jwt = await window.netlifyIdentity.refresh();
          }
          var freshUser = cur || user;
          try {
            if (freshUser && typeof freshUser.getUserData === "function") {
              freshUser = await freshUser.getUserData();
            }
          } catch (e) {
            console.warn("No se pudo refrescar metadata", e);
          }
          return { user: freshUser, jwt: jwt };
        } catch (err) {
          console.error("No se pudo refrescar Identity:", err);
          return {
            user: user,
            jwt: (user && user.token && user.token.access_token) || null
          };
        }
      }

      function redirectByRoles(roles) {
        // admin y editor van al editor de productos (Decap CMS).
        if (roles.indexOf("admin") !== -1)  { location.replace("/admin/"); return; }
        if (roles.indexOf("editor") !== -1) { location.replace("/admin/"); return; }
        location.replace("/");
      }

      function showErr(msg) {
        infoEl.style.display = "none";
        errEl.textContent = msg;
        errEl.style.display = "block";
      }
      function showInfo(msg) {
        errEl.style.display = "none";
        infoEl.textContent = msg;
        infoEl.style.display = "block";
      }

      function jwtRolesOf(session) {
        if (!session || !session.jwt) return [];
        var payload = decodeJwtPayload(session.jwt);
        if (payload && payload.app_metadata && Array.isArray(payload.app_metadata.roles)) {
          return payload.app_metadata.roles;
        }
        return [];
      }

      // ----------------------------------------------------------------------
      // init: sesión restaurada o primera visita
      // ----------------------------------------------------------------------
      window.netlifyIdentity.on("init", async function (user) {
        if (!user) {
          gate.style.display = "block";
          return;
        }
        var session = await getFreshSession(user);
        sessionRoles = jwtRolesOf(session).length ? jwtRolesOf(session) : rolesOf(session.user);
        showSessionPanel((user && user.email) || (session.user && session.user.email));

        // No se redirige automáticamente: la persona elige "Ir al panel"
        // o "Cerrar sesión" (permite entrar con otra cuenta).
      });

      // ----------------------------------------------------------------------
      // login: sesión nueva
      // ----------------------------------------------------------------------
      window.netlifyIdentity.on("login", async function (user) {
        window.netlifyIdentity.close();
        var session = await getFreshSession(user);
        var jwtRoles = jwtRolesOf(session);
        var userRoles = rolesOf(session.user);

        redirectByRoles(jwtRoles.length ? jwtRoles : userRoles);
      });

      // ----------------------------------------------------------------------
      // logout: el widget ya llamó a netlifyIdentity.logout() (limpia
      // sesión y la cookie nf_jwt por servidor). Solo volvemos a acceso.
      // ----------------------------------------------------------------------
      window.netlifyIdentity.on("logout", function () {
        gate.style.display = "block";
        location.replace("/acceso/");
      });

      window.netlifyIdentity.on("error", function (err) {
        var msg = (err && err.message) || "No se pudo completar el acceso.";
        if (/already registered|exists|duplicate/i.test(msg)) {
          msg = "Ese correo ya está registrado. Inicia sesión o elige otro.";
        }
        showErr(msg);
      });
    })();
  </script>
</body>
</html>
