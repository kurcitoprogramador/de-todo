<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Acceso · De Todo</title>
<style>
  :root {
    --mint: #b7e4c7;
    --pink: #f9d5e5;
    --peach: #ffd8be;
    --cream: #fdf6ee;
    --ink: #4a4453;
    --ink-soft: #8a8296;
    --surface: #ffffff;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fdeef4 0%, #eef7f1 45%, #fdf3ea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 14px 40px rgba(74, 68, 83, 0.12);
    padding: 28px;
  }
  .logo {
    display: block;
    max-width: 160px;
    margin: 0 auto 6px;
  }
  h1 { font-size: 20px; text-align: center; margin: 8px 0 2px; }
  .sub { color: var(--ink-soft); font-size: 13px; text-align: center; margin: 0 0 22px; }
  .hint { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 18px 0 0; }
  .hint a { color: var(--ink); font-weight: 600; }
  .err {
    background: #ffe5e5;
    color: #b3403a;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin: 0 0 14px;
    display: none;
  }
  .info {
    background: #eef7f1;
    color: #2a6f4a;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin: 0 0 14px;
    display: none;
  }
  .diag {
    background: #f5f0f8;
    border: 1px dashed #c9b8dd;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 11px;
    color: #5a5563;
    line-height: 1.5;
    margin-bottom: 14px;
    display: none;
    word-break: break-word;
  }
  #identity-gate { display: none; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/isologo/isologo-pastel-soft-144.png" alt="De Todo" />
    <h1>Bienvenido a De Todo</h1>
    <p class="sub">Inicia sesión o regístrate con tu correo.</p>

    <div class="err" id="err"></div>
    <div class="info" id="info"></div>
    <div class="diag" id="diag"></div>

    <div id="identity-gate">
      <div data-netlify-identity-button>Entrar / Registrarse</div>
    </div>

    <noscript>
      <p class="hint">Necesitas activar JavaScript para iniciar sesión.</p>
    </noscript>

    <p class="hint">
      ¿Solo quieres ver el catálogo? <a href="/">Ir a la tienda</a>
    </p>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      var errEl  = document.getElementById("err");
      var infoEl = document.getElementById("info");
      var diagEl = document.getElementById("diag");
      var gate   = document.getElementById("identity-gate");

      // ----------------------------------------------------------------------
      // Netlify Identity: ruta canónica de roles.
      //   app_metadata.roles                 <- fuente canónica (Netlify Identity)
      //   app_metadata.authorization.roles   <- solo lectura legacy/externo
      // ----------------------------------------------------------------------
      function rolesOf(user) {
        if (!user) return [];
        var am = user.app_metadata || {};
        if (Array.isArray(am.roles)) return am.roles;
        if (am.authorization && Array.isArray(am.authorization.roles)) return am.authorization.roles;
        return [];
      }

      // Decodifica SOLO el payload del JWT (sin verificar firma).
      // Temporal: sirve para el diagnóstico de roles. No muestra tokens.
      function decodeJwtPayload(token) {
        try {
          var b64 = token.split(".")[1];
          if (!b64) return null;
          var normalized = b64.replace(/-/g, "+").replace(/_/g, "/");
          var padded = normalized + "=".repeat((4 - (normalized.length % 4)) % 4);
          var json = decodeURIComponent(
            atob(padded)
              .split("")
              .map(function (c) {
                return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
              })
              .join("")
          );
          return JSON.parse(json);
        } catch (err) {
          console.error("JWT decode error:", err);
          return null;
        }
      }

      // Obtiene un JWT renovado y el perfil fresco del servidor.
      // refresh() una sola vez; getUserData() actualiza app_metadata.
      async function getFreshSession(user) {
        if (!user) return null;
        try {
          var jwt = await window.netlifyIdentity.refresh();
          var freshUser = window.netlifyIdentity.currentUser() || user;
          try {
            if (freshUser && typeof freshUser.getUserData === "function") {
              freshUser = await freshUser.getUserData();
            }
          } catch (e) {
            console.warn("No se pudo refrescar metadata", e);
          }
          return { user: freshUser, jwt: jwt };
        } catch (err) {
          console.error("No se pudo refrescar Identity:", err);
          return {
            user: user,
            jwt: (user && user.token && user.token.access_token) || null
          };
        }
      }

      function redirectByRoles(roles) {
        if (roles.indexOf("admin") !== -1)  { location.replace("/dashboard/"); return; }
        if (roles.indexOf("editor") !== -1) { location.replace("/admin/"); return; }
        location.replace("/");
      }

      function showErr(msg) {
        infoEl.style.display = "none";
        errEl.textContent = msg;
        errEl.style.display = "block";
      }
      function showInfo(msg) {
        errEl.style.display = "none";
        infoEl.textContent = msg;
        infoEl.style.display = "block";
      }

      // Diagnóstico TEMPORAL de sesión: solo datos no sensibles.
      function mostrarDiagnosticoTemporal(d) {
        try {
          var lineas = [];
          if (d.email) lineas.push("email: " + d.email);
          lineas.push("roles user (getUserData): " + JSON.stringify(d.userRoles));
          lineas.push("roles jwt: " + JSON.stringify(d.jwtRoles));
          if (d.payload && d.payload.exp) {
            lineas.push("jwt exp: " + new Date(d.payload.exp * 1000).toISOString());
          }
          lineas.push("refresh: " + (d.refreshOk ? "OK" : "fallback"));
          diagEl.textContent = "Diagnóstico: " + lineas.join(" | ");
          diagEl.style.display = "block";
        } catch (e) {
          diagEl.textContent = "Diagnóstico error: " + e.message;
          diagEl.style.display = "block";
        }
      }

      function jwtRolesOf(session) {
        if (!session || !session.jwt) return [];
        var payload = decodeJwtPayload(session.jwt);
        if (payload && payload.app_metadata && Array.isArray(payload.app_metadata.roles)) {
          return payload.app_metadata.roles;
        }
        return [];
      }

      // ----------------------------------------------------------------------
      // init: sesión restaurada o primera visita
      // ----------------------------------------------------------------------
      window.netlifyIdentity.on("init", async function (user) {
        if (!user) {
          gate.style.display = "block";
          return;
        }
        var session = await getFreshSession(user);
        var jwtRoles = jwtRolesOf(session);
        var userRoles = rolesOf(session.user);
        mostrarDiagnosticoTemporal({
          email: (user && user.email) || (session.user && session.user.email),
          userRoles: userRoles,
          jwtRoles: jwtRoles,
          payload: session.jwt ? decodeJwtPayload(session.jwt) : null,
          refreshOk: !!session.jwt
        });

        if (jwtRoles.length) {
          redirectByRoles(jwtRoles);
          return;
        }
        if (userRoles.length) {
          redirectByRoles(userRoles);
          return;
        }
        // Sin roles: mostrar la puerta (permite cerrar sesión y reintentar).
        gate.style.display = "block";
      });

      // ----------------------------------------------------------------------
      // login: sesión nueva
      // ----------------------------------------------------------------------
      window.netlifyIdentity.on("login", async function (user) {
        window.netlifyIdentity.close();
        var session = await getFreshSession(user);
        var jwtRoles = jwtRolesOf(session);
        var userRoles = rolesOf(session.user);
        mostrarDiagnosticoTemporal({
          email: (user && user.email) || (session.user && session.user.email),
          userRoles: userRoles,
          jwtRoles: jwtRoles,
          payload: session.jwt ? decodeJwtPayload(session.jwt) : null,
          refreshOk: !!session.jwt
        });

        redirectByRoles(jwtRoles.length ? jwtRoles : userRoles);
      });

      // ----------------------------------------------------------------------
      // logout: el widget ya llamó a netlifyIdentity.logout(). Aquí solo
      // limpiamos la cookie legacy y volvemos a la tienda (sin re-logout).
      // ----------------------------------------------------------------------
      window.netlifyIdentity.on("logout", function () {
        document.cookie = "nf_jwt=; path=/; max-age=0";
        gate.style.display = "block";
        location.replace("/");
      });

      window.netlifyIdentity.on("error", function (err) {
        var msg = (err && err.message) || "No se pudo completar el acceso.";
        if (/already registered|exists|duplicate/i.test(msg)) {
          msg = "Ese correo ya está registrado. Inicia sesión o elige otro.";
        }
        showErr(msg);
      });
    })();
  </script>
</body>
</html>
