<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Acceso · De Todo</title>
<style>
  :root {
    --mint: #b7e4c7;
    --pink: #f9d5e5;
    --peach: #ffd8be;
    --cream: #fdf6ee;
    --ink: #4a4453;
    --ink-soft: #8a8296;
    --surface: #ffffff;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fdeef4 0%, #eef7f1 45%, #fdf3ea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 14px 40px rgba(74, 68, 83, 0.12);
    padding: 28px;
  }
  .logo {
    display: block;
    max-width: 160px;
    margin: 0 auto 6px;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin: 8px 0 2px;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
    margin: 0 0 22px;
  }
  .hint {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 18px 0 0;
  }
  .hint a { color: var(--ink); font-weight: 600; }
  .err {
    background: #ffe5e5;
    color: #b3403a;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin: 0 0 14px;
    display: none;
  }
  .btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 13px 16px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--mint), var(--peach));
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.secondary {
    background: #f1ece6;
    margin-top: 8px;
  }
  #identity-gate { display: none; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/isologo/isologo-pastel-soft-144.png" alt="De Todo" />
    <h1>Bienvenido a De Todo</h1>
    <p class="sub">Inicia sesión o regístrate con tu correo.</p>

    <div class="err" id="err"></div>

    <div id="diagnostico" style="display:none;background:#f5f0f8;border:1px dashed #c9b8dd;border-radius:10px;padding:10px 12px;font-size:12px;color:#5a5563;line-height:1.5;margin-bottom:14px;"></div>

    <div id="identity-gate">
      <div data-netlify-identity-button>Entrar / Registrarse</div>
    </div>

    <noscript>
      <p class="hint">Necesitas activar JavaScript para iniciar sesión.</p>
    </noscript>

    <p class="hint">
      ¿Solo quieres ver el catálogo? <a href="/">Ir a la tienda</a>
    </p>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      var errEl = document.getElementById("err");
      var gate = document.getElementById("identity-gate");
      var diagEl = document.getElementById("diagnostico");

      // Diagnóstico temporal (se retira cuando se resuelva el acceso).
      function mostrarDiagnostico(user) {
        try {
          var lineas = [];
          if (user && user.email) lineas.push("email: " + user.email);
          lineas.push("roles(app_metadata): " + JSON.stringify(rolesOf(user)));
          var am = (user && user.app_metadata) || {};
          lineas.push("app_metadata: " + JSON.stringify(am).slice(0, 200));
          var hasCookie = document.cookie.indexOf("nf_jwt=") !== -1;
          lineas.push("cookie nf_jwt presente: " + hasCookie);
          diagEl.textContent = "Diagnóstico: " + lineas.join(" | ");
          diagEl.style.display = "block";
        } catch (e) {
          diagEl.textContent = "Diagnóstico error: " + e.message;
          diagEl.style.display = "block";
        }
      }

      function rolesOf(user) {
        if (!user || !user.app_metadata) return [];
        return (user.app_metadata.authorization && user.app_metadata.authorization.roles) || user.app_metadata.roles || [];
      }

      function redirectByRole(user) {
        var roles = rolesOf(user);
        if (roles.indexOf("admin") !== -1) {
          location.href = "/dashboard/";
        } else if (roles.indexOf("editor") !== -1) {
          location.href = "/admin/";
        } else {
          location.href = "/";
        }
      }

      // El widget no escribe la cookie nf_jwt que el edge usa para los
      // redirects por rol. La escribimos aquí para que /dashboard/ y
      // /admin/ reconozcan al usuario al cargar la página.
      function setNfJwt(user) {
        try {
          var token = (user && user.token && user.token.access_token) || "";
          if (token) {
            var secure = window.location.protocol === "https:" ? "; secure" : "";
            document.cookie = "nf_jwt=" + token + "; path=/; samesite=lax; max-age=3600" + secure;
          }
        } catch (err) {
          console.error("nf_jwt cookie error", err);
        }
      }

      window.netlifyIdentity.on("init", function (user) {
        mostrarDiagnostico(user);
        if (user) {
          setNfJwt(user);
          var roles = rolesOf(user);
          // Si el token ya trae rol, llevamos al panel correspondiente.
          // Si no trae rol (token viejo), mostramos la puerta para
          // cerrar sesión y volver a entrar con un token fresco.
          if (roles.indexOf("admin") !== -1 || roles.indexOf("editor") !== -1) {
            redirectByRole(user);
            return;
          }
        }
        gate.style.display = "block";
      });

      window.netlifyIdentity.on("login", function (user) {
        setNfJwt(user);
        mostrarDiagnostico(user);
        redirectByRole(user);
      });

      window.netlifyIdentity.on("logout", function () {
        document.cookie = "nf_jwt=; path=/; max-age=0";
        gate.style.display = "block";
      });

      window.netlifyIdentity.on("error", function (err) {
        var msg = (err && err.message) || "No se pudo completar el acceso.";
        if (/already registered|exists|duplicate/i.test(msg)) {
          msg = "Ese correo ya está registrado. Inicia sesión o elige otro.";
        }
        errEl.textContent = msg;
        errEl.style.display = "block";
      });
    })();
  </script>
</body>
</html>
