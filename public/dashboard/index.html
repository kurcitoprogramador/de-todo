<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel de estadísticas · De Todo</title>
<style>
  :root {
    --mint: #b7e4c7;
    --pink: #f9d5e5;
    --peach: #ffd8be;
    --cream: #fdf6ee;
    --ink: #4a4453;
    --ink-soft: #8a8296;
    --surface: #ffffff;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fdeef4 0%, #eef7f1 45%, #fdf3ea 100%);
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    box-shadow: 0 4px 16px rgba(74, 68, 83, 0.08);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header img { height: 40px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  main { max-width: 960px; margin: 24px auto; padding: 0 20px 48px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 8px 24px rgba(74, 68, 83, 0.08);
  }
  .stat .num { font-size: 26px; font-weight: 800; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .panel {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(74, 68, 83, 0.08);
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #f0ebe5; }
  th { color: var(--ink-soft); font-weight: 600; font-size: 12px; }
  td.emoji-free { vertical-align: top; }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .pill.admin { background: #ffe2e2; color: #b3403a; }
  .pill.editor { background: #d9f0ff; color: #2a6f9e; }
  .pill.none { background: #efeae4; color: var(--ink-soft); }
  .state {
    padding: 30px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .state .big { font-size: 18px; color: var(--ink); font-weight: 700; margin-bottom: 8px; }
  .state a { color: var(--ink); font-weight: 600; }
  .bar { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding-top: 10px; }
  .bar > div { flex: 1; background: linear-gradient(180deg, var(--pink), var(--peach)); border-radius: 4px 4px 0 0; min-height: 2px; }
  .barlabels { display: flex; gap: 4px; font-size: 9px; color: var(--ink-soft); }
  .barlabels span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }
  .err {
    background: #ffe5e5;
    color: #b3403a;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <header>
    <img src="/isologo/isologo-pastel-soft-144.png" alt="De Todo" />
    <h1>Panel de estadísticas</h1>
    <a href="/">Ver tienda</a>
  </header>

  <main>
    <div class="err" id="err" style="display:none"></div>
    <div class="state" id="loading">Cargando datos...</div>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      var main = document.querySelector("main");
      var errEl = document.getElementById("err");

      // Netlify Identity: ruta canónica de roles.
      //   app_metadata.roles                 <- fuente canónica
      //   app_metadata.authorization.roles   <- solo lectura legacy/externo
      function rolesOf(user) {
        if (!user) return [];
        var am = user.app_metadata || {};
        if (Array.isArray(am.roles)) return am.roles;
        if (am.authorization && Array.isArray(am.authorization.roles)) return am.authorization.roles;
        return [];
      }

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = "block";
        main.innerHTML = '<div class="state">No hay datos para mostrar.</div>';
      }

      function fmtDate(iso) {
        if (!iso) return "-";
        var d = new Date(iso);
        if (isNaN(d)) return "-";
        return d.toLocaleDateString("es-PE", { day: "2-digit", month: "short", year: "numeric" }) + " " +
               d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
      }

      function pill(roles) {
        if (roles.indexOf("admin") !== -1) return '<span class="pill admin">admin</span>';
        if (roles.indexOf("editor") !== -1) return '<span class="pill editor">editor</span>';
        return '<span class="pill none">solo lectura</span>';
      }

      function render(data) {
        var t = data.totals;
        var a = data.activity;
        var typeMap = { signup: "Alta", login: "Ingreso" };
        var typePill = function (tp) { return tp === "signup" ? '<span class="pill editor">alta</span>' : '<span class="pill none">ingreso</span>'; };

        var cards = document.createElement("section");
        cards.className = "cards";
        cards.innerHTML =
          '<div class="stat"><div class="num">' + t.usuarios + '</div><div class="lbl">usuarios</div></div>' +
          '<div class="stat"><div class="num">' + t.eventos + '</div><div class="lbl">movimientos</div></div>' +
          '<div class="stat"><div class="num">' + a.last7 + '</div><div class="lbl">actividad · 7 días</div></div>' +
          '<div class="stat"><div class="num">' + a.last30 + '</div><div class="lbl">actividad · 30 días</div></div>';

        main.innerHTML = "";
        main.appendChild(cards);

        // Gráfico de actividad por día
        if (data.byDay && data.byDay.length) {
          var max = 1;
          data.byDay.forEach(function (d) { if (d[1] > max) max = d[1]; });
          var dayPanel = document.createElement("section");
          dayPanel.className = "panel";
          dayPanel.innerHTML = '<h2>Movimientos por día (últimos 14)</h2>' +
            '<div class="bar">' + data.byDay.slice(0, 14).map(function (d) {
              return '<div style="height:' + Math.max(4, (d[1] / max) * 80) + '%" title="' + d[0] + ': ' + d[1] + '"></div>';
            }).join("") + '</div>' +
            '<div class="barlabels">' + data.byDay.slice(0, 14).map(function (d) {
              return '<span>' + d[0].slice(5) + '</span>';
            }).join("") + '</div>';
          main.appendChild(dayPanel);
        }

        // Usuarios
        var uPanel = document.createElement("section");
        uPanel.className = "panel";
        uPanel.innerHTML = '<h2>Usuarios registrados</h2>';
        var uTable = document.createElement("table");
        uTable.innerHTML =
          '<thead><tr><th>Correo</th><th>Rol</th><th>Ingresos</th><th>Última actividad</th></tr></thead><tbody>' +
          data.users.map(function (u) {
            return '<tr><td>' + u.email + '</td><td>' + pill(u.roles) + '</td><td>' + (u.logins || 0) + '</td><td>' + fmtDate(u.lastActivity) + '</td></tr>';
          }).join("") + '</tbody>';
        uPanel.appendChild(uTable);
        main.appendChild(uPanel);

        // Movimientos recientes
        var mPanel = document.createElement("section");
        mPanel.className = "panel";
        mPanel.innerHTML = '<h2>Movimientos recientes</h2>';
        var mTable = document.createElement("table");
        mTable.innerHTML =
          '<thead><tr><th>Tipo</th><th>Correo</th><th>Fecha</th></tr></thead><tbody>' +
          data.recent.map(function (e) {
            return '<tr><td>' + typePill(e.type) + '</td><td>' + e.email + '</td><td>' + fmtDate(e.at) + '</td></tr>';
          }).join("") + '</tbody>';
        mPanel.appendChild(mTable);
        main.appendChild(mPanel);
      }

      // Intenta leer stats. Estrategia doble:
      //   A) Authorization: Bearer con token fresco (refresh()).
      //   B) Sin header: la cookie HttpOnly nf_jwt (que el edge ya validó
      //      para permitir abrir esta página) autentica la función.
      function fetchStatsAttempt(token) {
        var opts = token
          ? { headers: { "Authorization": "Bearer " + token } }
          : {};
        return fetch("/.netlify/functions/stats", opts)
          .then(function (r) {
            return r.json().then(function (j) { return { ok: r.ok, j: j }; });
          });
      }

      function applyStats(res) {
        if (!res.ok) {
          var debug = res.j && res.j.debug;
          var extra = debug ? " | " + JSON.stringify(debug) : "";
          throw new Error(((res.j && res.j.error) || ("HTTP " + res.j)) + extra);
        }
        render(res.j);
      }

      function load() {
        var user = window.netlifyIdentity.currentUser();
        if (!user) {
          main.innerHTML = '<div class="state"><div class="big">No has iniciado sesión</div>' +
            '<a href="/acceso/">Ir a iniciar sesión</a></div>';
          return;
        }
        if (rolesOf(user).indexOf("admin") === -1) {
          main.innerHTML = '<div class="state"><div class="big">Acceso restringido</div>' +
            'Este panel es solo para el administrador. <a href="/">Volver a la tienda</a></div>';
          return;
        }

        // A) Token FRESCO del widget: jwt(true) fuerza renovación real del
        //    token (Netlify acuña un JWT nuevo con los roles actuales y
        //    renueva la cookie nf_jwt por servidor). Fallback: refresh().
        var refreshJwt = function () {
          var cur = window.netlifyIdentity.currentUser();
          if (cur && typeof cur.jwt === "function") {
            return cur.jwt(true);
          }
          return window.netlifyIdentity.refresh();
        };
        refreshJwt()
          .then(function (jwt) { return fetchStatsAttempt(jwt).then(applyStats); })
          .catch(function (errA) {
            var msgA = (errA && errA.message) || "error";
            // B) Reintento autenticado por la cookie nf_jwt del navegador.
            return fetchStatsAttempt(null)
              .then(applyStats)
              .catch(function (errB) {
                var msgB = (errB && errB.message) || "error";
                showError("No se pudieron cargar las estadísticas: " + msgB + (msgA !== msgB ? " (intento con token: " + msgA + ")" : ""));
              });
          });
      }

      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          main.innerHTML = '<div class="state"><div class="big">No has iniciado sesión</div>' +
            '<a href="/acceso/">Ir a iniciar sesión</a></div>';
          return;
        }
        load();
      });

      window.netlifyIdentity.on("login", function (user) {
        if (!user) return;
        load();
      });
      window.netlifyIdentity.on("logout", function () {
        main.innerHTML = '<div class="state"><div class="big">Sesión cerrada</div>' +
          '<a href="/acceso/">Ir a iniciar sesión</a></div>';
      });
    })();
  </script>
</body>
</html>
