<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Editor - De Todo</title>
<style>
  :root { --bg:#fbf8f3; --card:#fff; --ink:#302b3a; --muted:#83788f; --line:#eee5dc; --accent:#a8698f; --danger:#b83d3a; --soft:#f6efe8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:12px 14px; background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); backdrop-filter: blur(12px); }
  header h1 { margin:0; font-size:17px; flex:1; }
  header a { color:var(--ink); font-weight:800; font-size:13px; text-decoration:none; }
  main { max-width:920px; margin:0 auto; padding:14px 12px 108px; }
  input, textarea, select, button { width:100%; min-height:46px; border:1px solid #e5d9cf; border-radius:14px; padding:11px 12px; font:inherit; background:#fff; }
  textarea { min-height:92px; resize:vertical; }
  button, .upload-btn { border:0; background:var(--accent); color:#fff; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; text-align:center; }
  button.secondary { background:var(--soft); color:var(--ink); }
  button.danger { background:var(--danger); }
  label { display:grid; gap:6px; color:#655a70; font-size:13px; font-weight:800; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px; box-shadow:0 10px 28px rgba(75,62,88,.08); margin-bottom:14px; }
  .gate h2 { margin:0 0 8px; }
  .gate p, .hint { color:var(--muted); font-size:13px; line-height:1.45; }
  .toolbar { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .product-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .product-head .num { width:42px; height:42px; border-radius:14px; background:var(--soft); display:grid; place-items:center; font-weight:900; }
  .product-head strong { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .product-head button { width:auto; min-width:96px; }
  .fields { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
  .fields .wide { grid-column:1 / -1; }
  .images-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:16px 0 8px; }
  .images-title h3 { margin:0; font-size:16px; }
  .images { display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:12px; }
  .image-card { border:1px solid var(--line); border-radius:18px; background:#fffaf5; padding:10px; display:grid; gap:9px; }
  .thumb { aspect-ratio:1; border-radius:14px; overflow:hidden; background:var(--soft); display:grid; place-items:center; color:var(--muted); font-size:12px; text-align:center; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .image-card input { display:none; }
  .image-card details { font-size:12px; color:var(--muted); }
  .image-card summary { cursor:pointer; font-weight:800; }
  .image-card code { display:block; overflow-wrap:anywhere; margin-top:6px; }
  .upload-box { border:2px dashed #d9c9d4; border-radius:20px; padding:14px; background:#fff; margin-top:12px; display:grid; gap:10px; }
  .upload-btn input { display:none; }
  .status { display:none; position:sticky; top:58px; z-index:4; padding:12px; border-radius:14px; margin-bottom:12px; font-weight:800; }
  .ok { background:#e7f5ed; color:#2f7d5a; }
  .err { background:#ffe5e5; color:#b3403a; }
  .diag { display:none; white-space:pre-wrap; overflow-wrap:anywhere; background:#211d26; color:#f6edf7; border-radius:14px; padding:12px; margin-bottom:14px; font:12px/1.45 ui-monospace, Consolas, monospace; }
  .savebar { position:fixed; left:0; right:0; bottom:0; z-index:6; display:none; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid var(--line); box-shadow:0 -10px 24px rgba(75,62,88,.12); }
  .savebar button { flex:1; min-height:54px; }
  #editor { display:none; }
  @media (max-width:720px) { .fields { grid-template-columns:1fr 1fr; } .toolbar { grid-template-columns:1fr; } .product-head { align-items:flex-start; } .product-head button { min-width:86px; } }
  @media (max-width:440px) { main { padding-inline:10px; } .card { padding:14px; border-radius:18px; } .fields { grid-template-columns:1fr; } .images { grid-template-columns:repeat(2, minmax(0, 1fr)); } .product-head strong { white-space:normal; } }
</style>
</head>
<body>
<header><h1>Editor De Todo</h1><a href="/" target="_blank" rel="noopener">Ver tienda</a></header>
<main>
  <section class="card gate" id="gate">
    <h2>Entrar</h2>
    <p>Editor privado por clave. Desde aqui puedes editar productos y subir fotos desde tu galeria.</p>
    <label>Clave<input id="password" type="password" autocomplete="current-password" /></label>
    <div class="toolbar"><button id="enter">Entrar</button></div>
  </section>
  <div class="status ok" id="ok"></div>
  <div class="status err" id="err"></div>
  <pre class="diag" id="diag"></pre>
  <section id="editor">
    <section class="card"><label>WhatsApp<input id="whatsapp" inputmode="numeric" /></label></section>
    <div class="toolbar"><button id="add" class="secondary">Agregar producto</button><button id="save">Guardar cambios</button></div>
    <div id="products"></div>
  </section>
  <div class="savebar" id="savebar"><button id="save-bottom">Guardar cambios</button></div>
</main>
<script>
(function () {
  var state = { whatsapp:"", products:[] };
  var password = sessionStorage.getItem("editorPassword") || "";
  var els = {
    gate: document.getElementById("gate"), editor: document.getElementById("editor"), password: document.getElementById("password"), enter: document.getElementById("enter"),
    ok: document.getElementById("ok"), err: document.getElementById("err"), diag: document.getElementById("diag"), whatsapp: document.getElementById("whatsapp"),
    products: document.getElementById("products"), add: document.getElementById("add"), save: document.getElementById("save"), saveBottom: document.getElementById("save-bottom"), savebar: document.getElementById("savebar")
  };
  els.password.value = password;

  function show(el, msg, persist) { el.textContent = msg; el.style.display = "block"; if (!persist) setTimeout(function(){ el.style.display = "none"; }, 4500); }
  function diag(msg, data) { var line = "[" + new Date().toLocaleTimeString("es-PE") + "] " + msg; if (data) line += "\n" + JSON.stringify(data, null, 2); els.diag.textContent = (els.diag.textContent ? els.diag.textContent + "\n\n" : "") + line; els.diag.style.display = "block"; }
  function api(method, body) { return fetch("/api/catalog", { method:method, headers:{ "Content-Type":"application/json", "x-editor-password":password }, body: body ? JSON.stringify(body) : undefined }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Error"); return j; }); }); }
  function normalizeImages(value) { if (Array.isArray(value)) return value.map(function (v) { return typeof v === "string" ? v : (v && v.src) || ""; }).filter(Boolean); if (typeof value === "string") return value.split(/\s+/).filter(Boolean); return []; }
  function imageUrl(path) { if (!path) return ""; if (/^https?:\/\//i.test(path) || path.indexOf("data:") === 0) return path; return path.charAt(0) === "/" ? path : "/" + path; }
  function githubRaw(path) { if (!path || /^https?:\/\//i.test(path) || path.indexOf("data:") === 0) return ""; return "https://raw.githubusercontent.com/kurcitoprogramador/de-todo/main/public" + (path.charAt(0) === "/" ? path : "/" + path); }
  function setThumb(box, path, previewUrl) {
    box.textContent = "Cargando...";
    var src = previewUrl || imageUrl(path);
    if (!src) { box.textContent = "Sin imagen"; return; }
    var img = new Image();
    img.alt = "";
    img.onload = function () { box.textContent = ""; box.appendChild(img); };
    img.onerror = function () { var raw = githubRaw(path); if (raw && img.src !== raw) { img.src = raw; return; } box.textContent = "Pendiente"; };
    img.src = src;
  }
  function imageCard(path, previewUrl) {
    var card = document.createElement("div");
    card.className = "image-card";
    card.innerHTML = '<div class="thumb"></div><input name="image"><button type="button" class="danger">Quitar</button><details><summary>Ver ruta</summary><code></code></details>';
    var input = card.querySelector("input");
    input.value = path || "";
    card.querySelector("code").textContent = path || "";
    setThumb(card.querySelector(".thumb"), path, previewUrl);
    card.querySelector("button").addEventListener("click", function () { card.remove(); });
    return card;
  }
  function addImage(productEl, path, previewUrl) { productEl.querySelector(".images").appendChild(imageCard(path || "", previewUrl)); }
  function syncFromDom() {
    state.whatsapp = els.whatsapp.value.trim();
    state.products = Array.prototype.map.call(els.products.querySelectorAll(".product"), function (card) {
      return { name: card.querySelector("[name=name]").value.trim(), price: Number(card.querySelector("[name=price]").value || 0), description: card.querySelector("[name=description]").value.trim(), tag: card.querySelector("[name=tag]").value.trim(), availability: card.querySelector("[name=availability]").value, images: Array.prototype.map.call(card.querySelectorAll("[name=image]"), function (input) { return input.value.trim(); }).filter(Boolean) };
    }).filter(function (p) { return p.name; });
  }
  function saveCatalog() { show(els.ok, "Guardando cambios...", true); els.err.style.display = "none"; syncFromDom(); return api("PUT", { data:state }).then(function () { show(els.ok, "Guardado. El catalogo se actualizara en unos segundos."); }).catch(function (e) { diag("error al guardar", { message:e.message }); show(els.err, "No se pudo guardar: " + e.message, true); throw e; }); }
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { var img = new Image(); img.onload = function () { try { var max=1800, quality=.82, dataUrl="", canvas=document.createElement("canvas"), ctx=canvas.getContext("2d"); for (var i=1;i<=8;i++) { var scale=Math.min(1,max/Math.max(img.width,img.height)); canvas.width=Math.max(1,Math.round(img.width*scale)); canvas.height=Math.max(1,Math.round(img.height*scale)); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height); dataUrl=canvas.toDataURL("image/jpeg",quality); diag("compresion", { intento:i, bytes:Math.round((dataUrl.length-dataUrl.indexOf(",")-1)*.75), width:canvas.width, height:canvas.height }); if (dataUrl.length < 6800000) break; max=Math.round(max*.78); quality=Math.max(.58, quality-.06); } var base64=dataUrl.split(",")[1]; if (!base64) throw new Error("Canvas no devolvio base64."); resolve({ name:file.name.replace(/\.[^.]+$/, "") + ".jpg", base64:base64, previewUrl:dataUrl, bytes:Math.round(base64.length*.75), width:canvas.width, height:canvas.height }); } catch(e) { reject(e); } }; img.onerror = function () { reject(new Error("El navegador no pudo leer la imagen.")); }; img.src = String(reader.result || ""); };
      reader.onerror = function () { reject(new Error("No se pudo leer la imagen.")); };
      reader.readAsDataURL(file);
    });
  }
  function uploadImage(file) { diag("archivo seleccionado", { name:file.name, type:file.type, bytes:file.size }); return compressImage(file).then(function (packed) { diag("imagen lista", { name:packed.name, bytes:packed.bytes, width:packed.width, height:packed.height }); return fetch("/api/upload", { method:"POST", headers:{ "Content-Type":"application/json", "x-editor-password":password }, body:JSON.stringify({ name:packed.name, content:packed.base64 }) }).then(function (r) { return r.json().then(function (j) { diag("respuesta upload", { status:r.status, ok:r.ok, body:j }); if (!r.ok) throw new Error(j.error || "No se pudo subir."); j.previewUrl = packed.previewUrl; return j; }); }); }); }
  function productCard(p, index) {
    var div = document.createElement("section");
    div.className = "card product";
    div.innerHTML = '<div class="product-head"><div class="num">' + (index + 1) + '</div><strong></strong><button type="button" class="danger delete-product">Eliminar</button></div><div class="fields"><label>Nombre<input name="name"></label><label>Precio<input name="price" type="number" min="0"></label><label>Etiqueta<input name="tag"></label><label>Disponibilidad<select name="availability"><option value="disponible">Disponible</option><option value="pocas">Pocas unidades</option><option value="agotado">Agotado</option></select></label><label class="wide">Descripcion<textarea name="description"></textarea></label></div><div class="images-title"><h3>Imagenes</h3></div><p class="hint">Sube fotos desde tu galeria. La primera foto es la principal.</p><div class="images"></div><div class="upload-box"><label class="upload-btn">Subir desde galeria<input class="upload" type="file" accept="image/*" multiple></label><button type="button" class="secondary save-near">Guardar este cambio</button></div>';
    div.querySelector("strong").textContent = p.name || "Nuevo producto";
    div.querySelector("[name=name]").value = p.name || "";
    div.querySelector("[name=price]").value = p.price || 0;
    div.querySelector("[name=tag]").value = p.tag || "";
    div.querySelector("[name=availability]").value = p.availability || "disponible";
    div.querySelector("[name=description]").value = p.description || "";
    normalizeImages(p.images || p.image).forEach(function (src) { addImage(div, src); });
    div.querySelector("[name=name]").addEventListener("input", function (e) { div.querySelector("strong").textContent = e.target.value || "Nuevo producto"; });
    div.querySelector(".delete-product").addEventListener("click", function () { div.remove(); renumber(); });
    div.querySelector(".save-near").addEventListener("click", function () { saveCatalog().catch(function () {}); });
    div.querySelector(".upload").addEventListener("change", function (e) { var files = Array.prototype.slice.call(e.target.files || []); if (!files.length) return; els.diag.textContent = ""; show(els.ok, "Subiendo " + files.length + " imagen(es)...", true); Promise.all(files.map(uploadImage)).then(function (items) { items.forEach(function (item) { addImage(div, item.path, item.previewUrl); }); e.target.value = ""; return saveCatalog(); }).catch(function (err) { e.target.value = ""; show(els.err, err.message, true); }); });
    return div;
  }
  function renumber() { Array.prototype.forEach.call(els.products.querySelectorAll(".product"), function (p, i) { p.querySelector(".num").textContent = i + 1; }); }
  function render() { els.whatsapp.value = state.whatsapp || ""; els.products.innerHTML = ""; state.products.forEach(function (p, i) { els.products.appendChild(productCard(p, i)); }); }
  function load() { show(els.ok, "Cargando catalogo...", true); api("GET").then(function (j) { state = j.data || { whatsapp:"", products:[] }; els.ok.style.display = "none"; els.gate.style.display = "none"; els.editor.style.display = "block"; els.savebar.style.display = "flex"; render(); }).catch(function (e) { show(els.err, e.message, true); }); }
  els.enter.addEventListener("click", function () { password = els.password.value; sessionStorage.setItem("editorPassword", password); load(); });
  els.add.addEventListener("click", function () { els.products.prepend(productCard({ availability:"disponible", images:[] }, 0)); renumber(); window.scrollTo({ top:0, behavior:"smooth" }); });
  els.save.addEventListener("click", function () { saveCatalog().catch(function () {}); });
  els.saveBottom.addEventListener("click", function () { saveCatalog().catch(function () {}); });
  if (password) load();
})();
</script>
</body>
</html>
